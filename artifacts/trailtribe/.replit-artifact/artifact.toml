kind = "web"
previewPath = "/"
title = "TrailTribe"
version = "1.0.0"
id = "artifacts/trailtribe"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20671

[services.development]
run = "pnpm --filter @workspace/trailtribe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trailtribe", "run", "build" ]
publicDir = "artifacts/trailtribe/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20671"
BASE_PATH = "/"
