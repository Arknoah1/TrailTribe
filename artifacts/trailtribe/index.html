<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TrailTeam</title>
    <meta name="description" content="TrailTeam helps high school mountain bike teams coordinate riders, families, events, communications, and participation." />
    <link rel="canonical" href="https://trailteam.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TrailTeam" />
    <meta property="og:description" content="TrailTeam helps high school mountain bike teams coordinate riders, families, events, communications, and participation." />
    <meta property="og:url" content="https://trailteam.app/" />
    <meta property="og:image" content="https://trailteam.app/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrailTeam" />
    <meta name="twitter:description" content="TrailTeam helps high school mountain bike teams coordinate riders, families, events, communications, and participation." />
    <meta name="twitter:image" content="https://trailteam.app/opengraph.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        let startupErrorWritten = false;

        const formatStartupError = (error, fallbackMessage) => {
          const candidate = error ?? fallbackMessage;
          if (candidate && typeof candidate === "object") {
            const stack = typeof candidate.stack === "string" ? candidate.stack : "";
            if (stack) {
              return stack;
            }

            const message = typeof candidate.message === "string" ? candidate.message : "";
            if (message) {
              return message;
            }
          }

          if (candidate !== undefined && candidate !== null) {
            return String(candidate);
          }

          return "(unknown startup error)";
        };

        const showStartupError = (error, fallbackMessage) => {
          if (startupErrorWritten) {
            return;
          }

          const root = document.getElementById("root");
          if (!root || root.childElementCount !== 0) {
            return;
          }

          startupErrorWritten = true;
          const output = document.createElement("pre");
          output.textContent = `TrailTeam failed to start\n\n${formatStartupError(error, fallbackMessage)}`;
          output.style.margin = "0";
          output.style.minHeight = "100vh";
          output.style.boxSizing = "border-box";
          output.style.overflow = "auto";
          output.style.padding = "24px";
          output.style.background = "#111827";
          output.style.color = "#f9fafb";
          output.style.fontFamily = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
          output.style.whiteSpace = "pre-wrap";
          root.appendChild(output);
        };

        window.addEventListener("error", (event) => {
          showStartupError(event.error, event.message);
        });

        window.addEventListener("unhandledrejection", (event) => {
          showStartupError(event.reason, event.message);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
