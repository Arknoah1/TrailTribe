name: Build and Upload iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      live_site_mode:
        description: >-
          Experimental: make the iOS app load the live site (https://trailteam.app)
          inside the native shell instead of the bundled web assets. Used to test
          whether sign-in works when the page origin is a real https origin on the
          same site as the Clerk proxy (the bundled app's capacitor:// origin can't
          hold Clerk's cookies on iOS).
        type: boolean
        default: false
      native_http:
        description: >-
          Route the app's network requests and cookies through the native layer
          (CapacitorHttp + CapacitorCookies) so Clerk's cookie survives iOS's
          cross-site cookie blocking. Leave ticked unless testing without it.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test (Linux — macOS runners can't run Postgres service containers)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Amazon ECR Public's mirror of the official Docker Hub image, not
        # Docker Hub directly — GitHub-hosted runners share IPs across many
        # users, and anonymous Docker Hub pulls are rate-limited per IP, so
        # this step intermittently fails with "toomanyrequests" even though
        # nothing about the workflow or the app changed. ECR Public isn't
        # subject to that limit for ordinary CI use.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailteam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailteam_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web app
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/trailtribe run typecheck
          pnpm --filter @workspace/trailtribe run test

      - name: Provision test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Verify API server
        run: pnpm --filter @workspace/api-server run test:clean

  build-upload-testflight:
    name: Build, sign, and upload to TestFlight
    needs: verify
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Firebase config for push notifications
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_IOS_PLIST_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_IOS_PLIST_BASE64 }}" | base64 -d > artifacts/trailtribe/ios/App/App/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist — push notifications will be enabled in this build."
          else
            echo "GOOGLE_SERVICES_IOS_PLIST_BASE64 not set — build will fail (the Xcode project references this file as a Resources build phase input)."
            exit 1
          fi

      - name: Build web app and sync into native project
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          # Read by capacitor.config.ts (server.url). Empty = normal bundled-assets build.
          CAP_SERVER_URL: ${{ inputs.live_site_mode && 'https://trailteam.app' || '' }}
          # Required by the packaged-release guard in vite.config.ts to allow the
          # live-site URL above; has no effect when CAP_SERVER_URL is empty.
          ALLOW_LIVE_SITE_BUILD: ${{ inputs.live_site_mode && 'true' || 'false' }}
          # Read by capacitor.config.ts (plugins.CapacitorHttp / CapacitorCookies).
          CAP_NATIVE_HTTP: ${{ inputs.native_http && 'true' || 'false' }}
        run: |
          cd artifacts/trailtribe
          pnpm run mobile:sync

      - name: Verify native web bundle
        run: |
          cd artifacts/trailtribe
          node -e "
            import('./scripts/verify-mobile-bundle.mjs').then(async ({ verifyMobileBundle }) => {
              const result = await verifyMobileBundle({ nativeDir: 'ios/App/App/public' });
              console.log('[mobile bundle] verified ' + result.fileCount + ' files against ios/App/App/public');
            }).catch((err) => {
              console.error(err instanceof Error ? err.message : err);
              process.exit(1);
            });
          "

      - name: Import signing certificate into a temporary keychain
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          echo "$IOS_DIST_CERT_BASE64" | base64 -d > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > "$PROFILE_DIR/trailteam-app-store.mobileprovision"

      - name: Write export options
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>MSCL9BB7Y9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.trailteam.trailteam</key>
              <string>TrailTeam App Store</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Resolve Swift Package dependencies
        run: |
          cd artifacts/trailtribe/ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Archive
        run: |
          cd artifacts/trailtribe/ios/App
          # Manual signing (CODE_SIGN_STYLE, CODE_SIGN_IDENTITY, PROVISIONING_PROFILE_SPECIFIER,
          # DEVELOPMENT_TEAM) is intentionally NOT passed here as a command-line build-setting
          # override. xcodebuild applies CLI overrides globally across the whole build graph,
          # including Firebase's transitive Swift Package Manager library targets (nanopb,
          # GoogleUtilities, Promises, FirebaseCore/Messaging internals) — none of which support
          # provisioning profiles at all, so a global override breaks the archive with
          # "X does not support provisioning profiles" for every one of them. Instead these
          # settings live in project.pbxproj on the App target's own Release build configuration,
          # which only applies to that target and leaves the SPM package targets on their
          # (unsigned) defaults.
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export IPA
        run: |
          cd artifacts/trailtribe/ios/App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
        run: |
          set -euo pipefail

          # Trim stray whitespace/newlines that can sneak into a copy-pasted secret —
          # GitHub does not trim secret values itself, and a trailing newline on the Key
          # ID or Issuer ID is enough to make Apple reject the signed JWT with a bare
          # "401 NOT_AUTHORIZED", which looks identical in altool's output to a wrong or
          # revoked key.
          APP_STORE_CONNECT_KEY_ID="$(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')"
          APP_STORE_CONNECT_ISSUER_ID="$(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')"

          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          # Base64-encoded (like GOOGLE_SERVICES_IOS_PLIST_BASE64 / IOS_DIST_CERT_BASE64
          # above) instead of pasted raw, so the PEM's internal line breaks can't get
          # mangled by a browser textarea or a Windows clipboard round-trip.
          echo "$APP_STORE_CONNECT_P8_BASE64" | base64 -d > "$KEY_PATH"

          # Sanity-check the decoded key before spending a full archive/export cycle to
          # find out it's malformed. This does not print the key itself.
          if ! head -1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "AuthKey file doesn't start with '-----BEGIN PRIVATE KEY-----' — APP_STORE_CONNECT_P8_BASE64 secret looks wrong."
            exit 1
          fi
          if ! tail -1 "$KEY_PATH" | grep -q 'END PRIVATE KEY'; then
            echo "AuthKey file doesn't end with '-----END PRIVATE KEY-----' — APP_STORE_CONNECT_P8_BASE64 secret looks wrong."
            exit 1
          fi
          echo "AuthKey file looks well-formed ($(wc -l < "$KEY_PATH") lines) for Key ID ${APP_STORE_CONNECT_KEY_ID}."

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found in export output"
            exit 1
          fi

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/trailteam-app-store.mobileprovision"
          rm -rf "$HOME/private_keys"
