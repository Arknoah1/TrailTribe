name: Build Signed Android Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build signed release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web app
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/trailtribe run typecheck
          pnpm --filter @workspace/trailtribe run test

      - name: Verify API server
        run: pnpm --filter @workspace/api-server run test:clean

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build web app and sync into native project
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter @workspace/trailtribe run mobile:sync

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd artifacts/trailtribe/android
          ./gradlew bundleRelease

      - name: Collect release bundle
        run: |
          set -euo pipefail
          source_aab="artifacts/trailtribe/android/app/build/outputs/bundle/release/app-release.aab"
          release_dir="release-assets"
          test -s "$source_aab"
          mkdir -p "$release_dir"
          cp "$source_aab" "$release_dir/trailteam-release.aab"
          sha256sum "$release_dir/trailteam-release.aab" > "$release_dir/trailteam-release.aab.sha256"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: trailteam-release-aab
          path: release-assets/
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
