name: Build Signed Android Release AAB

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: >-
          After building, upload the signed bundle to Google Play. Needs the
          PLAY_SERVICE_ACCOUNT_JSON secret. Leave unticked to only build the AAB
          (download it from the run's Artifacts).
        type: boolean
        default: false
      track:
        description: >-
          Play track to release to when uploading. Production is deliberately
          not allowed here — promote to production by hand in Play Console.
          Use "internal" for Internal testing, "alpha" for the default Closed
          testing track, "beta" for Open testing.
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal
      release_status:
        description: >-
          "completed" rolls the release out to the track's testers. "draft"
          only creates it for you to review and roll out in Play Console (also
          the fallback if Play says only draft releases are allowed for this app).
        type: choice
        options:
          - completed
          - draft
        default: completed

permissions:
  contents: read

jobs:
  build-release-aab:
    name: Build signed release bundle
    runs-on: ubuntu-latest

    services:
      postgres:
        # Amazon ECR Public's mirror of the official Docker Hub image, not
        # Docker Hub directly — GitHub-hosted runners share IPs across many
        # users, and anonymous Docker Hub pulls are rate-limited per IP, so
        # this step intermittently fails with "toomanyrequests" even though
        # nothing about the workflow or the app changed. ECR Public isn't
        # subject to that limit for ordinary CI use.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailteam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trailteam_test

    steps:
      - name: Check Google Play upload prerequisites
        if: ${{ inputs.upload_to_play }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "upload_to_play is ticked but the PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("type")=="service_account" and d.get("client_email") and d.get("private_key")'; then
            echo "PLAY_SERVICE_ACCOUNT_JSON is not a valid service-account key file (expected the full JSON downloaded from Google Cloud)."
            exit 1
          fi
          echo "Play service account key looks valid."

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify web app
        run: |
          pnpm run typecheck:libs
          pnpm --filter @workspace/trailtribe run typecheck
          pnpm --filter @workspace/trailtribe run test

      - name: Provision test database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Verify API server
        run: pnpm --filter @workspace/api-server run test:clean

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write Firebase config for push notifications
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > artifacts/trailtribe/android/app/google-services.json
            echo "Wrote google-services.json — push notifications will be enabled in this build."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set — building without push notification support."
          fi

      - name: Build web app and sync into native project
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm --filter @workspace/trailtribe run mobile:sync

      - name: Verify native web bundle
        run: pnpm --filter @workspace/trailtribe run mobile:verify

      - name: Compute version code
        id: version
        run: |
          set -euo pipefail
          # Strictly increasing build number for Google Play: a fixed offset plus
          # this workflow's run number. The offset sits well above the hand-bumped
          # codes used before CI took over (last was 22) so the first CI build is
          # accepted. If you ever re-create this workflow (resetting the run
          # number), raise the offset so new codes stay above what Play has seen.
          VERSION_CODE_OFFSET=100
          code=$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))
          name=$(grep -E '^\s*versionName ' artifacts/trailtribe/android/app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### Android build $name ($code)" >> "$GITHUB_STEP_SUMMARY"
          echo "Version name: $name  |  version code: $code" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed release bundle
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd artifacts/trailtribe/android
          ./gradlew bundleRelease

      - name: Collect release bundle
        run: |
          set -euo pipefail
          source_aab="artifacts/trailtribe/android/app/build/outputs/bundle/release/app-release.aab"
          release_dir="release-assets"
          test -s "$source_aab"
          aab_contents="$RUNNER_TEMP/trailteam-aab-contents.bin"
          unzip -p "$source_aab" > "$aab_contents"
          if grep -a -E -q "pk_test_[A-Za-z0-9_$-]{12,}" "$aab_contents"; then
            echo "Development Clerk key found in release bundle"
            exit 1
          fi
          if ! grep -a -q "https://trailteam.app/api/__clerk" "$aab_contents"; then
            echo "Expected Clerk proxy URL missing from release bundle"
            exit 1
          fi
          mkdir -p "$release_dir"
          cp "$source_aab" "$release_dir/trailteam-release.aab"
          sha256sum "$release_dir/trailteam-release.aab" > "$release_dir/trailteam-release.aab.sha256"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: trailteam-release-aab
          path: release-assets/
          if-no-files-found: error

      - name: Upload to Google Play
        if: ${{ inputs.upload_to_play }}
        # Pinned to a commit (v1.1.5): this step receives the Play service
        # account key, so don't track a movable tag.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.trailteam.trailteam
          releaseFiles: release-assets/trailteam-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
