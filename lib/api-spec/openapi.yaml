    # ─── CARPOOL ──────────────────────────────────────────────────────────────

    CarpoolOffer:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        driverUserId:
          type: integer
        availableSeats:
          type: integer
        bikeTrayCount:
          type: integer
        departureLocation:
          type: string
          nullable: true
        departureTime:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventId
        - driverUserId
        - availableSeats
        - bikeTrayCount
        - createdAt

    CarpoolOfferWithClaims:
      allOf:
        - $ref: "#/components/schemas/CarpoolOffer"
        - type: object
          properties:
            driver:
              $ref: "#/components/schemas/User"
            claims:
              type: array
              items:
                $ref: "#/components/schemas/CarpoolClaimWithUser"
            seatsRemaining:
              type: integer
            bikeTraysRemaining:
              type: integer
          required: [driver, claims, seatsRemaining, bikeTraysRemaining]

    CarpoolClaim:
      type: object
      properties:
        id:
          type: integer
        carpoolOfferId:
          type: integer
        riderUserId:
          type: integer
        needsSeat:
          type: boolean
        needsBikeTray:
          type: boolean
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, carpoolOfferId, riderUserId, needsSeat, needsBikeTray, createdAt]

    CarpoolClaimWithUser:
      allOf:
        - $ref: "#/components/schemas/CarpoolClaim"
        - type: object
          properties:
            rider:
              $ref: "#/components/schemas/User"
          required: [rider]

    CreateCarpoolOfferBody:
      type: object
      properties:
        availableSeats:
          type: integer
        bikeTrayCount:
          type: integer
        departureLocation:
          type: string
        departureTime:
          type: string
          format: date-time
        notes:
          type: string
      required: [availableSeats, bikeTrayCount]

    UpdateCarpoolOfferBody:
      type: object
      properties:
        availableSeats:
          type: integer
        bikeTrayCount:
          type: integer
        departureLocation:
          type: string
        departureTime:
          type: string
          format: date-time
        notes:
          type: string

    ClaimCarpoolBody:
      type: object
      properties:
        needsSeat:
          type: boolean
        needsBikeTray:
          type: boolean
        notes:
          type: string
      required: [needsSeat, needsBikeTray]

    CarpoolRequest:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        riderUserId:
          type: integer
        requestedByUserId:
          type: integer
        needsBikeTray:
          type: boolean
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, matched, cancelled]
        matchedOfferId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, eventId, riderUserId, requestedByUserId, needsBikeTray, status, createdAt, updatedAt]

    CarpoolRequestWithUsers:
      allOf:
        - $ref: "#/components/schemas/CarpoolRequest"
        - type: object
          properties:
            rider:
              $ref: "#/components/schemas/User"
              nullable: true
            requestedBy:
              $ref: "#/components/schemas/User"
              nullable: true
            matchedOffer:
              nullable: true
              type: object
              properties:
                id:
                  type: integer
                driver:
                  $ref: "#/components/schemas/User"
                  nullable: true

    CreateCarpoolRequestBody:
      type: object
      properties:
        riderUserId:
          type: integer
          nullable: true
          description: If null, defaults to the requesting user
        needsBikeTray:
          type: boolean
        notes:
          type: string

    UpdateCarpoolRequestBody:
      type: object
      properties:
        needsBikeTray:
          type: boolean
        notes:
          type: string
        status:
          type: string
          enum: [cancelled, matched]
          description: Allowed transitions from open - cancelled or matched (requires matchedOfferId)
        matchedOfferId:
          type: integer
          nullable: true
          description: Required when setting status to matched

    MatchCarpoolRequestBody:
      type: object
      properties:
        offerId:
          type: integer
        autoCreated:
          type: boolean
          description: >
            True when the client auto-created this offer specifically for the match.
            When true the matched rider consumes a seat (reducing displayed availability).
            When false (default) the driver is extending their existing offer capacity and
            the displayed seat count remains unchanged.
      required: [offerId]

