openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TrailTribe team management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: households
    description: Household management
  - name: pods
    description: Pod management
  - name: events
    description: Event management
  - name: rsvps
    description: RSVP management
  - name: carpools
    description: Carpool management
  - name: trailheads
    description: Trailhead library
  - name: messages
    description: Messaging/broadcasts
  - name: board
    description: Community message board (threads and replies)
  - name: invites
    description: Invite links
  - name: storage
    description: File storage
  - name: dashboard
    description: Dashboard summaries
  - name: calendar
    description: iCal calendar feed

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get team dashboard summary (counts, upcoming events, compliance stats)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/upcoming-events:
    get:
      operationId: getUpcomingEvents
      tags: [dashboard]
      summary: Get upcoming events for the current user (this week + next)
      responses:
        "200":
          description: List of upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithDetails"

  # ─── USERS ───────────────────────────────────────────────────────────────────

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile and notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin/coach only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, coach, parent, student]
        - name: podId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/onboard:
    post:
      operationId: onboardUser
      tags: [users]
      summary: Complete onboarding - create/link user after Clerk auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserBody"
      responses:
        "201":
          description: User created or linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── HOUSEHOLDS ──────────────────────────────────────────────────────────────

  /households:
    get:
      operationId: listHouseholds
      tags: [households]
      summary: List households (admin/coach only)
      responses:
        "200":
          description: List of households with members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseholdWithMembers"
    post:
      operationId: createHousehold
      tags: [households]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdBody"
      responses:
        "201":
          description: Created household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"

  /households/{id}:
    get:
      operationId: getHousehold
      tags: [households]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Household with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdWithMembers"
    patch:
      operationId: updateHousehold
      tags: [households]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdBody"
      responses:
        "200":
          description: Updated household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"

  /households/{id}/compliance:
    patch:
      operationId: updateHouseholdCompliance
      tags: [households]
      summary: Mark compliance docs as signed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplianceBody"
      responses:
        "200":
          description: Updated household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"

  # ─── PODS ────────────────────────────────────────────────────────────────────

  /pods:
    get:
      operationId: listPods
      tags: [pods]
      summary: List all pods
      responses:
        "200":
          description: List of pods with member counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PodWithStats"
    post:
      operationId: createPod
      tags: [pods]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePodBody"
      responses:
        "201":
          description: Created pod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pod"

  /pods/{id}:
    get:
      operationId: getPod
      tags: [pods]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pod with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodWithMembers"
    patch:
      operationId: updatePod
      tags: [pods]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePodBody"
      responses:
        "200":
          description: Updated pod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pod"
    delete:
      operationId: deletePod
      tags: [pods]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pod deleted

  /pods/reorder:
    post:
      operationId: reorderPods
      tags: [pods]
      summary: Set pod display order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPodsBody"
      responses:
        "204":
          description: Reordered successfully

  # ─── EVENTS ──────────────────────────────────────────────────────────────────

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: eventType
          in: query
          schema:
            type: string
            enum: [practice, race, social, volunteer, other]
        - name: podId
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithDetails"
    post:
      operationId: createEvent
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithDetails"

  /events/batch:
    post:
      operationId: batchCreateEvents
      tags: [events]
      summary: Batch-create multiple events (season builder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCreateEventsBody"
      responses:
        "201":
          description: Batch create result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCreateEventsResult"

  /series/{seriesId}:
    delete:
      operationId: deleteSeries
      tags: [events]
      summary: Delete all future events in a series (coach/admin only)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
        - name: fromDate
          in: query
          description: Delete events on or after this date (ISO). Defaults to now.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                required: [deleted]

  /series/{seriesId}/reschedule:
    patch:
      operationId: rescheduleSeries
      tags: [events]
      summary: Shift all future events in a series by N days (coach/admin only)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shiftDays:
                  type: integer
                  description: Number of days to shift (positive = forward, negative = backward)
                fromDate:
                  type: string
                  format: date
                  description: Only reschedule events on or after this date. Defaults to now.
              required: [shiftDays]
      responses:
        "200":
          description: Reschedule result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rescheduled:
                    type: integer
                required: [rescheduled]

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event with details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithDetails"
    patch:
      operationId: updateEvent
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWithDetails"
    delete:
      operationId: deleteEvent
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/rsvp:
    post:
      operationId: rsvpEvent
      tags: [rsvps]
      summary: RSVP to an event (or update existing RSVP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpBody"
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRsvp"

  /events/{id}/rsvps:
    get:
      operationId: listEventRsvps
      tags: [rsvps]
      summary: List RSVPs for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of RSVPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRsvpWithUser"

  /events/{id}/volunteers:
    get:
      operationId: listEventVolunteers
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of volunteer sign-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerSignupWithUser"
    post:
      operationId: signUpVolunteer
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerSignupBody"
      responses:
        "201":
          description: Volunteer sign-up created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerSignup"

  /events/{id}/volunteers/{volunteerId}:
    delete:
      operationId: cancelVolunteerSignup
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: volunteerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled

  /events/{id}/volunteer-tasks-enabled:
    patch:
      operationId: setEventVolunteerTasksEnabled
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required: [enabled]
      responses:
        "200":
          description: Updated

  /events/{id}/tasks:
    get:
      operationId: listEventTasks
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of event tasks with signup info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventTaskWithSignups"
    post:
      operationId: createEventTask
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTaskBody"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTask"

  /events/{id}/tasks/clone-template:
    post:
      operationId: cloneEventTasksFromTemplate
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateTaskIds:
                  type: array
                  items:
                    type: integer
                  description: IDs of templates to clone. If omitted, all templates are cloned.
      responses:
        "201":
          description: Tasks added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                required: [added]

  /events/{id}/tasks/bulk-signup:
    post:
      operationId: bulkSignupForEventTasks
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taskIds:
                  type: array
                  items:
                    type: integer
              required: [taskIds]
      responses:
        "201":
          description: Bulk signup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                  skipped:
                    type: integer
                required: [added, skipped]

  /events/{id}/tasks/{taskId}:
    patch:
      operationId: updateEventTask
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventTaskBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTask"
    delete:
      operationId: deleteEventTask
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/tasks/{taskId}/signup:
    post:
      operationId: signUpForEventTask
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTaskSignup"
    delete:
      operationId: cancelEventTaskSignup
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled

  /events/{id}/tasks/{taskId}/signups/{signupId}:
    delete:
      operationId: removeEventTaskSignup
      summary: Coach/admin removes a specific volunteer signup by ID
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: signupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /volunteer-tasks/templates:
    get:
      operationId: listVolunteerTemplateTasks
      tags: [events]
      responses:
        "200":
          description: List of template tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VolunteerTemplateTask"
    post:
      operationId: createVolunteerTemplateTask
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerTemplateTaskBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerTemplateTask"

  /volunteer-tasks/templates/{id}:
    put:
      operationId: updateVolunteerTemplateTask
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerTemplateTaskBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerTemplateTask"
    delete:
      operationId: deleteVolunteerTemplateTask
      tags: [events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/attachments:
    post:
      operationId: addEventAttachment
      tags: [events]
      summary: Add a file attachment (e.g. race PDF flyer) to an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttachmentBody"
      responses:
        "201":
          description: Attachment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAttachment"

  # ─── CARPOOLS ────────────────────────────────────────────────────────────────

  /events/{id}/carpools:
    get:
      operationId: listEventCarpools
      tags: [carpools]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Carpool offers with claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarpoolOfferWithClaims"
    post:
      operationId: createCarpoolOffer
      tags: [carpools]
      summary: Offer to drive (post available seats and bike tray slots)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarpoolOfferBody"
      responses:
        "201":
          description: Carpool offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolOffer"

  /carpools/{offerId}:
    patch:
      operationId: updateCarpoolOffer
      tags: [carpools]
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarpoolOfferBody"
      responses:
        "200":
          description: Updated carpool offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolOffer"
    delete:
      operationId: deleteCarpoolOffer
      tags: [carpools]
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /carpools/{offerId}/claims:
    post:
      operationId: claimCarpool
      tags: [carpools]
      summary: Claim a seat and/or bike tray in a carpool
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
