  # ─── CALENDAR ────────────────────────────────────────────────────────────────

  /users/me/volunteer-signups:
    get:
      operationId: getMyVolunteerSignups
      tags: [users]
      summary: List the current user's volunteer task signups with task and event details
      responses:
        "200":
          description: List of volunteer signups with enriched task and event info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyVolunteerSignup"

  /users/me/regenerate-calendar-token:
    post:
      operationId: regenerateCalendarToken
      tags: [users]
      summary: Regenerate the personal iCal calendar token, invalidating the old link
      responses:
        "200":
          description: New subscribe URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSubscribeUrl"
        "403":
          description: Account not yet approved
        "404":
          description: User not found

  /calendar/subscribe-url:
    get:
      operationId: getCalendarSubscribeUrl
      tags: [calendar]
      summary: Get the personal iCal subscribe URL for the current user
      responses:
        "200":
          description: Subscribe URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSubscribeUrl"
        "403":
          description: Account not yet approved

  /calendar/{token}/team.ics:
    get:
      operationId: getTeamIcsFeed
      tags: [calendar]
      summary: Public iCal feed (token-authenticated, no session required)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "404":
          description: Invalid token

# ─── SCHEMAS ─────────────────────────────────────────────────────────────────

components:
  schemas:
    CalendarSubscribeUrl:
      type: object
      properties:
        subscribeUrl:
          type: string
          description: webcal:// URL for one-click subscribe in calendar apps
        httpsUrl:
          type: string
          description: https:// URL for direct .ics download
      required: [subscribeUrl, httpsUrl]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # ─── USER ─────────────────────────────────────────────────────────────────

    UserNotificationPreferences:
      type: object
      properties:
        practiceReminders:
          type: boolean
        coachMessages:
          type: boolean
        carpoolUpdates:
          type: boolean
        eventReminders:
          type: boolean
        rosterUpdates:
          type: boolean
        boardReplies:
          type: boolean
      required:
        - practiceReminders
        - coachMessages
        - carpoolUpdates
        - eventReminders
        - rosterUpdates
        - boardReplies

    User:
      type: object
      properties:
        id:
          type: integer
        householdId:
          type: integer
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, coach, parent, student]
        podId:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        gender:
          type: string
          nullable: true
        grade:
          type: integer
          nullable: true
        coachCertLevel:
          type: string
          nullable: true
        notificationsEnabled:
          type: boolean
        emailNotifications:
          type: boolean
        smsNotifications:
          type: boolean
        pushNotifications:
          type: boolean
        defaultCarpoolSeats:
          type: integer
          nullable: true
        defaultCarpoolTrays:
          type: integer
          nullable: true
        notificationPreferences:
          $ref: '#/components/schemas/UserNotificationPreferences'
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - email
        - role
        - isActive
        - notificationsEnabled
        - emailNotifications
        - smsNotifications
        - pushNotifications
        - createdAt

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        gender:
          type: string
        grade:
          type: integer
        notificationsEnabled:
          type: boolean
        emailNotifications:
          type: boolean
        smsNotifications:
          type: boolean
        pushNotifications:
          type: boolean
        notificationPreferences:
          $ref: '#/components/schemas/UserNotificationPreferences'
          nullable: true
        defaultCarpoolSeats:
          type: integer
          nullable: true
        defaultCarpoolTrays:
          type: integer
          nullable: true

    OnboardUserBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [parent, student]
        inviteCode:
          type: string
          nullable: true
      required: [firstName, lastName, role]

    ApproveUserBody:
      type: object
      properties:
        podId:
          type: string
        householdId:
          type: integer
        role:
          type: string
          enum: [admin, coach, parent, student]
      required: [podId, role]

    # ─── HOUSEHOLD ────────────────────────────────────────────────────────────

    Household:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        inviteCode:
          type: string
        podId:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        emergencyContactName:
          type: string
          nullable: true
        emergencyContactPhone:
          type: string
          nullable: true
        liabilityWaiverSigned:
          type: boolean
        liabilityWaiverSignedAt:
          type: string
          format: date-time
          nullable: true
        mediaReleaseSigned:
          type: boolean
        mediaReleaseSignedAt:
          type: string
          format: date-time
          nullable: true
        codeOfConductSigned:
          type: boolean
        codeOfConductSignedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - inviteCode
        - liabilityWaiverSigned
        - mediaReleaseSigned
        - codeOfConductSigned
        - createdAt

    HouseholdWithMembers:
      allOf:
        - $ref: "#/components/schemas/Household"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/User"
          required: [members]

    CreateHouseholdBody:
      type: object
      properties:
        name:
          type: string
        podId:
          type: string
        address:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string
      required: [name]

    UpdateHouseholdBody:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        emergencyContactName:
          type: string
        emergencyContactPhone:
          type: string

    UpdateComplianceBody:
      type: object
      properties:
        liabilityWaiverSigned:
          type: boolean
        mediaReleaseSigned:
          type: boolean
        codeOfConductSigned:
          type: boolean

    # ─── POD ──────────────────────────────────────────────────────────────────

    Pod:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        headCoachId:
          type: integer
          nullable: true
        color:
          type: string
          nullable: true
        season:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, isActive, sortOrder, createdAt]

    ReorderPodsBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
      required: [ids]

    PodWithStats:
      allOf:
        - $ref: "#/components/schemas/Pod"
        - type: object
          properties:
            studentCount:
              type: integer
            coachCount:
              type: integer
            complianceRate:
              type: number
          required: [studentCount, coachCount, complianceRate]

    PodWithMembers:
      allOf:
        - $ref: "#/components/schemas/Pod"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/User"
            coaches:
              type: array
              items:
                $ref: "#/components/schemas/User"
          required: [members, coaches]

    CreatePodBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        headCoachId:
          type: integer
        color:
          type: string
        season:
          type: string
      required: [name]

    UpdatePodBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        headCoachId:
          type: integer
        color:
          type: string
        season:
          type: string
        isActive:
          type: boolean

    # ─── EVENT ────────────────────────────────────────────────────────────────

    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        eventType:
          type: string
          enum: [practice, race, social, volunteer, other]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        trailheadId:
          type: integer
          nullable: true
        locationOverride:
          type: string
          nullable: true
        googleMapsUrlOverride:
          type: string
          nullable: true
        podIds:
          type: array
          items:
            type: string
          nullable: true
        isAllTeam:
          type: boolean
        rsvpDeadline:
          type: string
          format: date-time
          nullable: true
        volunteerSlotsNeeded:
          type: integer
        iCalUid:
          type: string
        isArchived:
          type: boolean
        seriesId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
